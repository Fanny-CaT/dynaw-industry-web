            - generic [ref=e978]: Can custom uniforms be made safely for all sports?
            - img [ref=e979]
          - generic [ref=e981]: Yes, we design custom uniforms specifically for each sport considering the unique movements, safety requirements, and regulations of that sport.
        - generic [ref=e982] [cursor=pointer]:
